<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-container">
        
        <div class="login-card">
            
        
            <div class="left-section">
                <img src="https://png.pngtree.com/png-clipart/20240731/original/pngtree-dirty-clothes-and-washing-machine-png-image_15670097.png" alt="Laundry Image" height="500" width="500">
            </div>

            <div class="form-section">
                <div class="form-header">
                    <h2>Hello Again!</h2>
                    <p>Welcome back! Please enter your Email-Id and Password to access your account.</p>
                </div>

                
                <form>
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="abcxyz@gmail.com" 
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Password Please" 
                            required
                        >
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                </form>

            </div>

        </div>

    </div>

</body>
</html>
